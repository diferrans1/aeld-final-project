# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "aesd-bme280"
BBFILE_PATTERN_aesd-bme280 = "^${LAYERDIR}/"
BBFILE_PRIORITY_aesd-bme280 = "10"

LAYERDEPENDS_aesd-bme280 = "core raspberrypi openembedded-layer"
LAYERSERIES_COMPAT_aesd-bme280 = "scarthgap"
